<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F2F4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Content">
<title>Content Made Simple</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* One screen at a time, iOS style. Big title, tappable rows, sticky bottom button. */
  :root {
    color-scheme: light;
    --bg: #F2F4FF;
    --card: #FFFFFF;
    --ink: #15172E;
    --muted: #5C6080;
    --line: #DFE3F5;
    --primary: #3A4FF7;
    --primary-press: #2B3CD6;
    --primary-soft: #E8EBFF;
    --sun: #FFD23F;
    --sun-soft: #FFF4CC;
    --selfie: #FFD9E6; --selfie-ink: #A3164F;
    --pov: #D5E8FF;    --pov-ink: #1450A8;
    --third: #CFF5E3;  --third-ink: #0E7049;
    --mix: #FFE6C9;    --mix-ink: #9A4D00;
    --good: #12A66A;
    --display: "Bricolage Grotesque", "Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); }
  body { font-size: 18px; line-height: 1.45; overflow-x: hidden; }
  button { font: inherit; color: inherit; }

  .app { position: relative; max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* Top bar */
  .bar {
    position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; min-height: 60px;
  }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--card); display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 1px 2px rgba(21,23,46,.08); transition: transform .12s var(--ease), opacity .2s; }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn[hidden] { display: grid !important; visibility: hidden; }
  .icon-btn svg { width: 22px; height: 22px; }
  .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .track > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 99px; transition: width .5s var(--ease); }
  .bar-title { text-align: center; font-weight: 700; font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Screens */
  .stage { position: relative; flex: 1; }
  .screen {
    padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 14px;
    animation: inR .38s var(--ease) both;
  }
  .screen.back { animation-name: inL; }
  .screen.fade { animation-name: fadeUp; }
  @keyframes inR { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes inL { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); }
  h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; margin: 0; }
  .sub { color: var(--muted); font-size: 18px; margin: 0; }
  p { margin: 0; }

  /* Inputs */
  .field { width: 100%; font: inherit; font-size: 20px; padding: 16px 18px; border: 2px solid var(--line); border-radius: 18px; background: var(--card); color: var(--ink);
    resize: none; transition: border-color .15s, box-shadow .15s; }
  .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 5px var(--primary-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 0; background: var(--card); border-radius: 99px; padding: 9px 14px; font-size: 16px; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--line);
    transition: transform .12s var(--ease), background .15s; }
  .chip:active { transform: scale(.94); background: var(--primary-soft); }

  /* Options */
  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; cursor: pointer;
    background: var(--card); border-radius: 18px; padding: 18px; font-size: 19px; font-weight: 700; min-height: 64px;
    box-shadow: inset 0 0 0 2px var(--line), 0 1px 2px rgba(21,23,46,.05);
    transition: transform .12s var(--ease), box-shadow .15s, background .15s; }
  .opt:active { transform: scale(.975); }
  .opt .tick { flex: none; width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; transition: all .2s var(--ease); background: var(--card); }
  .opt.multi .tick { border-radius: 9px; }
  .opt .tick svg { width: 16px; height: 16px; opacity: 0; transform: scale(.4); transition: all .22s var(--ease); }
  .opt.on { background: var(--primary-soft); box-shadow: inset 0 0 0 2.5px var(--primary); }
  .opt.on .tick { background: var(--primary); box-shadow: none; }
  .opt.on .tick svg { opacity: 1; transform: scale(1); }
  .opt.other { font-weight: 400; color: var(--muted); }
  .hint-pill { align-self: flex-start; background: var(--sun-soft); color: #7A5A00; font-size: 14px; font-weight: 700; padding: 5px 10px; border-radius: 99px; }

  /* Bottom action */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: none;
    padding: 14px max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .dock-inner { max-width: 524px; margin: 0 auto; pointer-events: auto; }
  .dock[hidden] { display: none !important; }
  .cta { width: 100%; border: 0; border-radius: 18px; padding: 18px; font-size: 19px; font-weight: 700; cursor: pointer;
    background: var(--primary); color: #fff; box-shadow: 0 8px 20px -8px rgba(58,79,247,.6);
    transition: transform .12s var(--ease), background .15s, opacity .2s, box-shadow .2s; }
  .cta:active { transform: scale(.97); background: var(--primary-press); box-shadow: 0 4px 10px -6px rgba(58,79,247,.6); }
  .cta:disabled { opacity: .35; box-shadow: none; transform: none; }
  .cta.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .cta.ghost:active { background: var(--primary-soft); }

  /* Loader */
  .loader { min-height: 70vh; justify-content: center; align-items: center; text-align: center; gap: 22px; }
  .rec { position: relative; width: 112px; height: 170px; border-radius: 26px; background: var(--ink); box-shadow: 0 20px 40px -18px rgba(21,23,46,.6); overflow: hidden; }
  .rec::before { content: ""; position: absolute; inset: 8px; border-radius: 19px; background: linear-gradient(160deg, #4F63FF, #8A5CFF 55%, #FF6FA3); }
  .rec .frame { position: absolute; left: 22px; right: 22px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.85); animation: slide 2.4s var(--ease) infinite; }
  .rec .frame:nth-child(2) { animation-delay: .8s; } .rec .frame:nth-child(3) { animation-delay: 1.6s; }
  .rec .dot { position: absolute; top: 18px; right: 18px; width: 12px; height: 12px; border-radius: 50%; background: #FF3B4F; animation: blink 1.1s infinite; }
  @keyframes slide { 0% { top: 180px; opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { top: -30px; opacity: 0; } }
  @keyframes blink { 50% { opacity: .25; } }
  .steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; text-align: left; width: 100%; max-width: 320px; }
  .steps li { display: flex; align-items: center; gap: 12px; font-size: 18px; color: var(--muted); opacity: .45; transition: opacity .3s, color .3s; }
  .steps li .s { flex: none; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; transition: all .25s var(--ease); }
  .steps li .s svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: all .25s var(--ease); }
  .steps li.now { opacity: 1; color: var(--ink); font-weight: 700; }
  .steps li.now .s { box-shadow: inset 0 0 0 3px var(--primary); animation: ring 1s infinite; }
  .steps li.done { opacity: 1; color: var(--ink); }
  .steps li.done .s { background: var(--good); box-shadow: none; }
  .steps li.done .s svg { opacity: 1; transform: scale(1); }
  @keyframes ring { 50% { box-shadow: inset 0 0 0 3px var(--primary), 0 0 0 5px var(--primary-soft); } }

  /* Idea cards */
  .ideas { display: flex; flex-direction: column; gap: 12px; }
  .idea { display: grid; grid-template-columns: 1fr 28px; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; cursor: pointer;
    background: var(--card); border-radius: 22px; padding: 18px; box-shadow: 0 1px 2px rgba(21,23,46,.06), 0 8px 24px -16px rgba(21,23,46,.25);
    transition: transform .14s var(--ease); animation: fadeUp .4s var(--ease) both; }
  .idea:active { transform: scale(.975); }
  .idea .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .idea .t { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.15; }
  .idea .l { color: var(--muted); font-size: 16px; }
  .idea .why { font-size: 15px; color: var(--third-ink); background: var(--third); border-radius: 10px; padding: 6px 10px; align-self: flex-start; }
  .lvl { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: var(--sun-soft); color: #7A5A00; }
  .lvl.q::before { content: "\25CF  "; } .lvl.e::before { content: "\25CF\25CF  "; } .lvl.b::before { content: "\25CF\25CF\25CF  "; }
  .idea .go { width: 28px; height: 28px; color: var(--primary); }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); }
  .tag.selfie { background: var(--selfie); color: var(--selfie-ink); }
  .tag.pov { background: var(--pov); color: var(--pov-ink); }
  .tag.third { background: var(--third); color: var(--third-ink); }
  .tag.mix { background: var(--mix); color: var(--mix-ink); }
  .secs { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Shot list */
  .hero { background: var(--ink); color: #fff; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--sun); opacity: .9; }
  .hero > * { position: relative; z-index: 1; }
  .hero h1 { color: #fff; font-size: 30px; max-width: 85%; }
  .hero .row { display: flex; gap: 18px; font-size: 15px; color: #C9CCE6; }
  .hero .row b { display: block; font-size: 24px; color: #fff; font-family: var(--display); }
  .meter { height: 10px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 99px; transition: width .45s var(--ease); }
  .clips { display: flex; flex-direction: column; gap: 12px; }
  .clip { background: var(--card); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 1px 2px rgba(21,23,46,.06), 0 8px 24px -16px rgba(21,23,46,.25); transition: opacity .3s, transform .3s var(--ease); animation: fadeUp .4s var(--ease) both; }
  .clip-head { display: flex; align-items: center; gap: 12px; }
  .num { flex: none; width: 40px; height: 40px; border-radius: 13px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; transition: background .25s; }
  .shot { font-size: 20px; font-weight: 700; line-height: 1.3; }
  .howto { background: var(--card); border-radius: 18px; padding: 14px 16px; font-size: 16px; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
  .howto b { color: var(--ink); }
  .cta.inline { margin-top: 4px; }
  .custom { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .jobchip { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: 0; cursor: pointer; text-align: left;
    background: var(--ink); color: #fff; border-radius: 18px; padding: 14px 16px; transition: transform .12s var(--ease); }
  .jobchip:active { transform: scale(.98); }
  .jobchip span { font-family: var(--display); font-weight: 800; font-size: 20px; }
  .jobchip small { display: block; font-family: var(--body); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sun); }
  .jobchip em { font-style: normal; font-size: 15px; font-weight: 700; color: var(--sun); white-space: nowrap; }
  .lab { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .say { background: var(--sun-soft); border-radius: 14px; padding: 12px 14px; font-size: 19px; font-weight: 700; position: relative; }
  .say::before { content: "\201C"; font-family: var(--display); font-size: 40px; line-height: 1; position: absolute; left: 10px; top: 4px; color: var(--sun); }
  .say { margin-top: 8px; font-weight: 400; }
  .say small { display: block; padding-left: 18px; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #7A5A00; }
  .say span { display: block; padding-left: 18px; font-style: italic; }
  .own { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .done-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 14px; cursor: pointer; font-weight: 700; font-size: 17px;
    background: var(--bg); color: var(--ink); transition: transform .12s var(--ease), background .2s, color .2s; }
  .done-btn:active { transform: scale(.97); }
  .done-btn svg { width: 20px; height: 20px; }
  .clip.done { opacity: .62; }
  .clip.done .num { background: var(--good); }
  .clip.done .done-btn { background: var(--good); color: #fff; }
  .edit { background: var(--card); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 2px var(--primary-soft); }
  .edit ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .party { background: var(--third); color: var(--third-ink); border-radius: 22px; padding: 18px; display: flex; gap: 14px; align-items: center; animation: pop .45s var(--ease) both; }
  .party svg { flex: none; width: 40px; height: 40px; }
  .party b { display: block; font-size: 19px; color: var(--ink); }
  @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: none; } }

  .err { background: var(--card); border-radius: 22px; padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .link { background: none; border: 0; color: var(--primary); font-weight: 700; padding: 10px 0; cursor: pointer; }

  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 99px; font-size: 16px; font-weight: 700; z-index: 40; transition: all .3s var(--ease); pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }


  /* Shot cards: one shot per screen, snap as you scroll */
  html.snap { scroll-snap-type: y proximity; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .screen.shots { gap: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sc { scroll-snap-align: start; min-height: calc(100svh - 96px - env(safe-area-inset-top, 0px)); background: var(--card); border-radius: 26px; padding: 22px 20px;
    display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 2px rgba(21,23,46,.06), 0 14px 34px -20px rgba(21,23,46,.35); transition: opacity .3s; }
  .sc-top { display: flex; justify-content: space-between; align-items: center; }
  .sc-n { font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); }
  .dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--primary); width: 22px; border-radius: 99px; }
  .sc-style { display: flex; flex-direction: column; gap: 2px; border-radius: 16px; padding: 12px 14px; background: var(--primary-soft); color: var(--primary); }
  .sc-style b { font-family: var(--display); font-size: 22px; font-weight: 800; }
  .sc-style span { font-size: 16px; }
  .sc-style.selfie { background: var(--selfie); color: var(--selfie-ink); } .sc-style.pov { background: var(--pov); color: var(--pov-ink); }
  .sc-style.third { background: var(--third); color: var(--third-ink); } .sc-style.mix { background: var(--mix); color: var(--mix-ink); }
  .sc-lab { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .sc-what { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.15; text-wrap: balance; }
  .sc-how { font-size: 21px; line-height: 1.35; font-weight: 700; }
  .sc-talk { border-left: 4px solid var(--primary); padding-left: 14px; display: flex; flex-direction: column; gap: 6px; }
  .sc-eg { font-size: 18px; } .sc-own { font-size: 15px; color: var(--muted); }
  .sc-tip { display: flex; gap: 12px; align-items: flex-start; background: var(--sun-soft); border-radius: 16px; padding: 14px; font-size: 18px; line-height: 1.35; }
  .sc-tip svg { flex: none; width: 28px; height: 28px; color: #B58900; }
  .sc-tip b { display: block; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #7A5A00; margin-bottom: 2px; }
  .got { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 18px; padding: 18px; cursor: pointer;
    font-size: 19px; font-weight: 700; background: var(--primary); color: #fff; box-shadow: 0 8px 20px -8px rgba(58,79,247,.6); transition: transform .12s var(--ease), background .2s; }
  .got:active { transform: scale(.97); }
  .got svg { width: 22px; height: 22px; }
  .sc.done .got { background: var(--good); box-shadow: none; }
  .sc-end h1 { font-size: 32px; }
  .sc-end .cta { margin-top: auto; }
  .pop { position: fixed; z-index: 50; display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
    background: var(--ink); color: #fff; font-size: 17px; font-weight: 700; padding: 13px 16px; border-radius: 16px;
    box-shadow: 0 12px 30px -10px rgba(21,23,46,.6); opacity: 0; transform: translateY(-6px) scale(.96); transform-origin: top right;
    transition: opacity .18s var(--ease), transform .18s var(--ease); }
  .pop.show { opacity: 1; transform: none; }
  .pop::before { content: ""; position: absolute; top: -6px; right: 16px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
  .pop svg { width: 18px; height: 18px; color: var(--sun); }
  .pop:active { transform: scale(.96); }
  .more { margin-top: 6px; background: var(--card); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: inset 0 0 0 2px var(--primary-soft); border: 2px dashed var(--line); }
  .more b { display: block; font-family: var(--display); font-size: 21px; font-weight: 800; }
  .more span { color: var(--muted); font-size: 17px; }
  .cta.thinking { display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 1; background: var(--primary); }
  .cta.thinking:disabled { opacity: 1; }
  .dots3 { display: inline-flex; gap: 5px; } .dots3 i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: bob 1s infinite var(--ease); }
  .dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="barMid"></div>
    <button class="icon-btn" id="menuBtn" aria-label="Start over" title="Start over" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>
  <main class="stage" id="stage"></main>
</div>
<div class="dock" id="dock" hidden><div class="dock-inner"><button class="cta" id="ctaBtn"></button></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), dock = $("dock"), cta = $("ctaBtn");
  const KEY = "cms_v3";
  const ICON_TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ICON_GO = '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

  let S = { name: "", business: "", questions: [], answers: {}, ideas: [], formats: [], idea: null, shot: null, done: {} };
  try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) S = Object.assign(S, saved); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ name: S.name, business: S.business, questions: S.questions, answers: S.answers, ideas: S.ideas, formats: S.formats })); } catch {} };

  let researchP = Promise.resolve();
  const cache = {};       // idea id -> shot list promise
  let history = [];       // stack of screen functions for Back
  let current = null;
  let loadToken = 0;

  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch {} };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const first = () => (S.name ? S.name.split(" ")[0] : "");
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); };
  const jobIndex = () => S.questions.findIndex((q) => q.id === "job" || /what job/i.test(q.text || ""));
  const jobAnswer = () => { const i = jobIndex(); return i >= 0 ? S.answers[S.questions[i].text] : ""; };
  const tagIds = (arr) => arr.map((x, k) => Object.assign({}, x, { id: "i" + Date.now().toString(36) + k }));
  const lvlClass = (l) => { const s = String(l || "").toLowerCase(); return s.startsWith("quick") ? "q" : s.startsWith("easy") ? "e" : "b"; };
  const talkOf = (c) => String(c.talk || (c.say ? "Talk to the camera" : "") || "").trim();
  const exOf = (c) => String(c.example || c.say || "").trim();
  const styleClass = (st) => { const s = String(st || "").toLowerCase(); if (s.startsWith("self")) return "selfie"; if (s.startsWith("pov")) return "pov"; if (s.startsWith("3") || s.startsWith("third")) return "third"; if (s.startsWith("mix")) return "mix"; return ""; };

  // ---------- navigation ----------
  function go(fn, opts) {
    opts = opts || {};
    if (current && !opts.replace && !opts.noHistory) history.push(current);
    current = fn;
    loadToken++;
    document.documentElement.classList.remove("snap");
    stage.innerHTML = "";
    const el = document.createElement("section");
    el.className = "screen" + (opts.back ? " back" : opts.fade ? " fade" : "");
    stage.appendChild(el);
    window.scrollTo({ top: 0 });
    fn(el);
  }
  $("backBtn").onclick = () => { buzz(); const prev = history.pop(); if (prev) go(prev, { back: true, noHistory: true }); };
  const pop = document.createElement("button");
  pop.className = "pop"; pop.id = "startOver"; pop.hidden = true;
  pop.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Tap to start over';
  document.body.appendChild(pop);
  const closePop = () => { pop.hidden = true; pop.classList.remove("show"); };
  $("menuBtn").onclick = (e) => {
    e.stopPropagation(); buzz();
    if (!pop.hidden) return closePop();
    const r = $("menuBtn").getBoundingClientRect();
    pop.style.top = (r.bottom + 10) + "px";
    pop.style.right = (window.innerWidth - r.right) + "px";
    pop.hidden = false;
    requestAnimationFrame(() => pop.classList.add("show"));
  };
  pop.onclick = (e) => { e.stopPropagation(); buzz(12); closePop(); restart(); };
  document.addEventListener("click", (e) => { if (!pop.hidden && e.target !== pop) closePop(); });
  window.addEventListener("scroll", closePop, { passive: true });
  function restart() {
    try { localStorage.removeItem(KEY); } catch {}
    S = { name: "", business: "", questions: [], answers: {}, ideas: [], formats: [], idea: null, shot: null, done: {} };
    for (const k in cache) delete cache[k];
    history = []; current = null;
    go(NameScreen, { fade: true });
    toast("Fresh start");
  }

  function bar(opts) {
    $("backBtn").hidden = !opts.back;
    $("menuBtn").hidden = false;
    const mid = $("barMid");
    if (opts.progress != null) {
      mid.innerHTML = '<div class="track"><i></i></div>';
      requestAnimationFrame(() => { mid.querySelector("i").style.width = Math.max(6, opts.progress * 100) + "%"; });
    } else mid.innerHTML = opts.title ? '<div class="bar-title">' + esc(opts.title) + "</div>" : "";
  }
  function setCta(label, onTap, opts) {
    opts = opts || {};
    if (!label) { dock.hidden = true; return; }
    dock.hidden = false;
    cta.textContent = label;
    cta.className = "cta" + (opts.ghost ? " ghost" : "");
    cta.disabled = !!opts.disabled;
    cta.onclick = () => { if (cta.disabled) return; buzz(); onTap(); };
  }

  function inlineCta(parent, label, onTap, disabled) {
    setCta(null);
    const b = document.createElement("button");
    b.className = "cta inline";
    b.textContent = label;
    b.disabled = !!disabled;
    // keep the keyboard open: stop the tap from blurring the input first
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.onclick = () => { if (b.disabled) return; buzz(); onTap(); };
    parent.appendChild(b);
    return b;
  }
  // When the keyboard opens, scroll so the Next button under the box stays visible.
  document.addEventListener("focusin", (e) => {
    if (!/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const b = stage.querySelector(".cta.inline");
    if (!b) return;
    [300, 650].forEach((t) => setTimeout(() => {
      const vv = window.visualViewport, bottom = vv ? vv.height + vv.offsetTop : window.innerHeight;
      const r = b.getBoundingClientRect();
      if (r.bottom > bottom - 12) window.scrollBy({ top: r.bottom - bottom + 24, behavior: "smooth" });
    }, t));
  });
  const setupTotal = () => 2 + Math.max(S.questions.length, 3);

  // ---------- screens ----------
  function NameScreen(el) {
    bar({ progress: 1 / setupTotal() });
    el.innerHTML =
      '<span class="eyebrow">Content Made Simple</span>' +
      "<h1>Hey. Let's make your next video easy.</h1>" +
      '<p class="sub">I will tell you exactly what to film, shot by shot. First up, what is your name?</p>' +
      '<input class="field" id="nameIn" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" placeholder="Your first name">';
    const inp = el.querySelector("#nameIn");
    inp.value = S.name || "";
    const ok = () => inp.value.trim().length > 0;
    const next = () => { if (!ok()) return; S.name = inp.value.trim(); save(); go(BizScreen); };
    const btn = inlineCta(el, "Next", next, !ok());
    inp.oninput = () => { btn.disabled = !ok(); };
    inp.onkeydown = (e) => { if (e.key === "Enter") next(); };
    setTimeout(() => inp.focus(), 350);
  }

  function BizScreen(el) {
    bar({ progress: 2 / setupTotal(), back: true });
    el.innerHTML =
      '<span class="eyebrow">Nice to meet you, ' + esc(first()) + "</span>" +
      "<h1>What does your business do?</h1>" +
      '<textarea class="field" id="bizIn" rows="2" enterkeyhint="next" placeholder="Explain it like you would to a customer"></textarea>' +
      '<div id="bizBtn"></div>' +
      '<div class="lab" style="margin-top:6px">Popular businesses</div><div class="chips" id="eg"></div>';
    const ta = el.querySelector("#bizIn");
    let btn = { disabled: true };
    ta.value = S.business || "";
    ["Car Detailing", "Hair Salon", "Cafe", "Real Estate Agent", "Personal Trainer"].forEach((t) => {
      const c = document.createElement("button"); c.className = "chip"; c.textContent = t;
      c.onclick = () => { buzz(); ta.value = t; btn.disabled = false; };
      el.querySelector("#eg").appendChild(c);
    });
    const ok = () => ta.value.trim().length > 2;
    const next = () => {
      if (!ok()) return;
      const b = ta.value.trim();
      if (b !== S.business) { S.business = b; S.questions = []; S.answers = {}; S.ideas = []; S.formats = []; }
      save();
      if (S.questions.length) go(qScreen(0)); else loadQuestions();
    };
    btn = inlineCta(el.querySelector("#bizBtn"), "Next", next, !ok());
    ta.oninput = () => { btn.disabled = !ok(); };
    ta.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); next(); } };
  }

  function loadQuestions() {
    loadingScreen({
      title: "Getting to know your business",
      steps: ["Reading what you do", "Looking at videos that work in your industry", "Working out a few quick questions"],
      task: () => {
        S.formats = [];
        researchP = api({ mode: "research", business: S.business }).then((d) => { S.formats = (d.formats || []).slice(0, 10); save(); }).catch(() => {});
        return api({ mode: "questions", name: S.name, business: S.business });
      },
      done: (d) => {
        S.questions = (d.questions || []).slice(0, 4).map((q) => Object.assign({ multi: false }, q, { options: (q.options || []).slice(0, 4) }));
        S.answers = {}; save();
        if (!S.questions.length) return loadIdeas();
        go(qScreen(0), { replace: true });
      },
    });
  }

  function qScreen(i, jobOnly) {
    return function QuestionScreen(el) {
      const q = S.questions[i];
      bar(jobOnly ? { back: true } : { progress: (3 + i) / setupTotal(), back: true });
      const picked = new Set([].concat(S.answers[q.text] || []));
      el.innerHTML =
        '<span class="eyebrow">' + (function () {
          if (jobOnly) return "Next video";
          const isJob = q.id === "job" || /what job/i.test(q.text || "");
          if (isJob) return "Your video";
          const rest = S.questions.filter((x) => !(x.id === "job" || /what job/i.test(x.text || "")));
          return "Quick question " + (rest.indexOf(q) + 1) + " of " + rest.length;
        })() + "</span>" +
        "<h1>" + esc(q.text) + "</h1>" +
        (q.multi ? '<span class="hint-pill">Pick as many as you like</span>' : "") +
        '<div class="opts" id="opts"></div>';
      const box = el.querySelector("#opts");
      const advance = () => {
        S.answers[q.text] = q.multi ? [...picked] : [...picked][0];
        save();
        if (!jobOnly && i + 1 < S.questions.length) go(qScreen(i + 1)); else loadIdeas();
      };
      const opts = q.options.slice();
      opts.forEach((o) => {
        const b = document.createElement("button");
        b.className = "opt" + (q.multi ? " multi" : "") + (picked.has(o) ? " on" : "");
        b.innerHTML = '<span class="tick">' + ICON_TICK + "</span><span>" + esc(o) + "</span>";
        b.onclick = () => {
          buzz(10);
          if (q.multi) {
            picked.has(o) ? picked.delete(o) : picked.add(o);
            b.classList.toggle("on", picked.has(o));
            cta.disabled = picked.size === 0;
          } else {
            picked.clear(); picked.add(o);
            box.querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === b));
            setTimeout(advance, 260);
          }
        };
        box.appendChild(b);
      });
      if (q.custom) {
        const wrap = document.createElement("div");
        wrap.className = "custom";
        wrap.innerHTML = '<div class="lab">Or type your own</div><input class="field" id="customIn" enterkeyhint="next" placeholder="e.g. Headlight restore">';
        box.after(wrap);
        const ci = wrap.querySelector("input");
        const prev = S.answers[q.text];
        if (prev && !q.options.includes(prev)) ci.value = prev;
        const useTyped = () => { const v = ci.value.trim(); if (!v) return; picked.clear(); picked.add(v); advance(); };
        const cbtn = inlineCta(wrap, "Next", useTyped, !ci.value.trim());
        ci.oninput = () => {
          cbtn.disabled = !ci.value.trim();
          if (ci.value.trim()) { picked.clear(); box.querySelectorAll(".opt").forEach((x) => x.classList.remove("on")); }
        };
        ci.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); useTyped(); } };
      } else if (q.multi) setCta("Next", advance, { disabled: picked.size === 0 });
      else setCta(null);
    };
  }

  function loadIdeas() {
    for (const k in cache) delete cache[k];
    loadingScreen({
      title: jobAnswer() ? "Creating " + jobAnswer().toLowerCase() + " video ideas" : "Creating video ideas for you",
      sub: first() ? "Hang tight " + first() + ", this takes a few seconds." : "This takes a few seconds.",
      steps: ["Looking at your answers", "Matching you with videos that already work", "Writing 3 ideas you can film this week"],
      task: () => researchP.then(() => api({ mode: "ideas", name: S.name, business: S.business, answers: S.answers, formats: S.formats })),
      done: (d) => { S.ideas = tagIds((d.ideas || []).slice(0, 3)); save(); history = []; go(IdeasScreen, { replace: true, fade: true }); },
    });
  }

  function IdeasScreen(el) {
    bar({ title: S.business ? "" : "", reset: true });
    el.innerHTML =
      '<span class="eyebrow">Your ideas</span>' +
      "<h1>" + (first() ? esc(first()) + ", pick a video to make" : "Pick a video to make") + "</h1>" +
      (jobAnswer() ? '<button class="jobchip" id="jobChip"><span><small>Job</small>' + esc(jobAnswer()) + '</span><em>Change job</em></button>' : "") +
      '<p class="sub">Tap one and I will give you some shot ideas.</p>' +
      '<div class="ideas" id="ideas"></div>';
    const jc = el.querySelector("#jobChip");
    if (jc) jc.onclick = () => { buzz(); const ji = jobIndex(); if (ji >= 0) go(qScreen(ji, true)); };
    const list = el.querySelector("#ideas");
    const card = (idea, n) => {
      const b = document.createElement("button");
      b.className = "idea";
      b.style.animationDelay = n * 70 + "ms";
      b.innerHTML =
        '<div class="body"><div class="meta">' + (idea.level ? '<span class="lvl ' + lvlClass(idea.level) + '">' + esc(idea.level) + "</span>" : "") + '<span class="tag ' + styleClass(idea.style) + '">' + esc(idea.style) + '</span><span class="secs">' + esc(idea.seconds || 30) + " sec</span></div>" +
        '<div class="t">' + esc(idea.title) + '</div><div class="l">' + esc(idea.line) + "</div>" + (idea.why ? '<div class="why">' + esc(idea.why) + "</div>" : "") + "</div>" + ICON_GO;
      b.onclick = () => { buzz(10); openShot(idea); };
      return b;
    };
    S.ideas.forEach((idea, n) => list.appendChild(card(idea, n)));

    const more = document.createElement("div");
    more.className = "more";
    const job = jobAnswer();
    more.innerHTML = '<div><b>Want more ideas?</b><span>I will think up 3 new ' + (job ? esc(job.toLowerCase()) + " " : "") + "videos for you.</span></div>" +
      '<button class="cta" id="moreBtn">Show me 3 more</button>';
    el.appendChild(more);
    const mb = more.querySelector("#moreBtn");
    let busy = false;
    mb.onclick = () => {
      if (busy) return;
      busy = true; buzz(10);
      mb.disabled = true; mb.classList.add("thinking");
      mb.innerHTML = '<span class="dots3"><i></i><i></i><i></i></span>Thinking up 3 more';
      const token = loadToken;
      researchP.then(() => api({ mode: "ideas", business: S.business, answers: S.answers, formats: S.formats, avoid: S.ideas.map((x) => x.title) }))
        .then((d) => {
          if (token !== loadToken) return;
          const fresh = tagIds((d.ideas || []).slice(0, 3));
          S.ideas = S.ideas.concat(fresh); save();
          const firstNew = card(fresh[0], 0);
          fresh.forEach((idea, n) => list.appendChild(n === 0 ? firstNew : card(idea, n)));
          setTimeout(() => firstNew.scrollIntoView({ behavior: "smooth", block: "start" }), 120);
          buzz([8, 30, 8]);
          fresh.forEach((idea) => fetchShot(idea).catch(() => {}));
        })
        .catch(() => { if (token === loadToken) toast("That did not load. Try again."); })
        .finally(() => {
          busy = false; if (token !== loadToken) return;
          mb.disabled = false; mb.classList.remove("thinking"); mb.textContent = "Show me 3 more";
        });
    };
    setCta(null);
    prefetch();
  }

  // Get shot lists ready in the background so tapping feels instant.
  function prefetch() {
    let i = 0;
    const next = () => {
      const idea = S.ideas[i++];
      if (!idea) return;
      fetchShot(idea).finally(next);
    };
    next(); next();
  }
  function fetchShot(idea) {
    if (!cache[idea.id]) {
      cache[idea.id] = api({ mode: "shotlist", name: S.name, business: S.business, answers: S.answers, idea }).catch((e) => { delete cache[idea.id]; throw e; });
    }
    return cache[idea.id];
  }

  function openShot(idea) {
    S.idea = idea;
    let ready = false;
    const p = fetchShot(idea);
    p.then(() => { ready = true; }).catch(() => {});
    // If it is already loaded, skip the loading screen.
    setTimeout(() => {
      if (ready) { p.then((d) => { S.shot = d; S.done = {}; go(ShotScreen, { fade: true }); }); return; }
      loadingScreen({
        title: "Putting your shot ideas together",
        sub: "A few shots to grab and some ideas to talk about.",
        steps: ["Picking the key shots", "Adding a few talking ideas", "Adding tips for the Edits app"],
        task: () => fetchShot(idea),
        done: (d) => { S.shot = d; S.done = {}; go(ShotScreen, { replace: true, fade: true }); },
        keepHistory: true,
      });
    }, 30);
  }

  const STYLE_HELP = {
    selfie: "Front camera, facing you.",
    pov: "From your point of view. The camera sees what you see.",
    third: "Phone set up on something, filming the scene.",
    mix: "A mix of styles.",
  };
  function ShotScreen(el) {
    const s = S.shot || {};
    const clips = s.clips || [];
    document.documentElement.classList.add("snap");
    bar({ back: true, title: s.title || (S.idea && S.idea.title) });
    setCta(null);
    el.classList.add("shots");
    const cards = clips.map((c, i) => {
      const sc = styleClass(c.style);
      return '<article class="sc" data-i="' + i + '">' +
        '<div class="sc-top"><span class="sc-n">Shot ' + (i + 1) + " of " + clips.length + '</span><span class="dots">' +
          clips.map((_, k) => '<i class="' + (k === i ? "on" : "") + '"></i>').join("") + "</span></div>" +
        '<div class="sc-style ' + sc + '"><b>' + esc(c.style) + "</b><span>" + esc(STYLE_HELP[sc] || "") + "</span></div>" +
        '<div class="sc-block"><div class="sc-lab">What to film</div><p class="sc-what">' + esc(c.shot || c.film || "") + "</p></div>" +
        (c.how || c.hold ? '<div class="sc-block"><div class="sc-lab">How to film it</div><p class="sc-how">' + esc(c.how || c.hold) + "</p></div>" : "") +
        (talkOf(c) ? '<div class="sc-talk"><div class="sc-lab">Talk about</div><p class="sc-how">' + esc(talkOf(c)) + "</p>" +
          (exOf(c) ? '<p class="sc-eg">For example: <i>' + esc(exOf(c)) + "</i></p>" : "") + '<p class="sc-own">Use your own words. You know this better than anyone.</p></div>' : "") +
        (c.tip ? '<div class="sc-tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><div><b>Tip</b>' + esc(c.tip) + "</div></div>" : "") +
        '<button class="got"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Got it</span></button>' +
        "</article>";
    }).join("");
    const e = s.edit || {};
    el.innerHTML = cards +
      '<article class="sc sc-end" id="endCard">' +
        '<div class="sc-top"><span class="sc-n">Last step</span></div>' +
        '<h1 id="endTitle">Now put it together</h1>' +
        '<p class="sc-how">Open the Edits app and add your shots in order.</p>' +
        (e.music ? '<div class="sc-block"><div class="sc-lab">Music</div><p class="sc-how">' + esc(e.music) + "</p></div>" : "") +
        (e.text ? '<div class="sc-block"><div class="sc-lab">Text on screen</div><p class="sc-how">' + esc(e.text) + "</p></div>" : "") +
        (Array.isArray(e.tips) && e.tips.length ? '<div class="sc-tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><div><b>Tips</b>' + e.tips.map(esc).join("<br>") + "</div></div>" : "") +
        '<button class="cta" id="againBtn">Pick another video</button>' +
      "</article>";
    const arts = [...el.querySelectorAll(".sc")];
    const allDone = () => clips.length && clips.every((_, i) => S.done[i]);
    const paintEnd = () => { el.querySelector("#endTitle").textContent = allDone() ? "All shot. Nice work" + (first() ? " " + first() : "") + "." : "Now put it together"; };
    clips.forEach((_, i) => {
      const card = arts[i], btn = card.querySelector(".got");
      const paint = () => { card.classList.toggle("done", !!S.done[i]); btn.querySelector("span").textContent = S.done[i] ? "Got it" : "Got it, next shot"; };
      if (i === clips.length - 1) btn.querySelector("span").textContent = "Got it";
      paint();
      btn.onclick = () => {
        buzz(12);
        S.done[i] = true; paint(); paintEnd();
        if (allDone()) buzz([10, 40, 10]);
        setTimeout(() => arts[i + 1].scrollIntoView({ behavior: "smooth", block: "start" }), 180);
      };
    });
    paintEnd();
    el.querySelector("#againBtn").onclick = () => { buzz(); document.documentElement.classList.remove("snap"); history = []; go(IdeasScreen, { back: true, noHistory: true }); };
  }

  function confirmReset() {
    go(function ResetScreen(el) {
      bar({ back: true });
      el.innerHTML = "<h1>Start over?</h1><p class=\"sub\">This clears your name, your business and your ideas on this phone.</p>";
      setCta("Yes, start over", () => {
        try { localStorage.removeItem(KEY); } catch {}
        S = { name: "", business: "", questions: [], answers: {}, ideas: [], idea: null, shot: null, done: {} };
        history = []; current = null; go(NameScreen, { fade: true });
      });
    });
  }

  // ---------- loading ----------
  function loadingScreen(cfg) {
    const opts = { fade: true };
    const run = (el) => {
      const token = loadToken;
      bar({});
      setCta(null);
      el.classList.add("loader");
      el.innerHTML =
        '<div class="rec"><span class="frame"></span><span class="frame"></span><span class="frame"></span><span class="dot"></span></div>' +
        "<div><h2>" + esc(cfg.title) + "</h2>" + (cfg.sub ? '<p class="sub" style="margin-top:6px">' + esc(cfg.sub) + "</p>" : "") + "</div>" +
        '<ul class="steps">' + cfg.steps.map((t) => '<li><span class="s">' + ICON_TICK + "</span>" + esc(t) + "</li>").join("") + "</ul>";
      const lis = [...el.querySelectorAll(".steps li")];
      let at = 0;
      const mark = () => lis.forEach((li, k) => { li.className = k < at ? "done" : k === at ? "now" : ""; });
      mark();
      const timer = setInterval(() => { if (at < lis.length - 1) { at++; mark(); buzz(5); } }, 2200);
      const minWait = new Promise((r) => setTimeout(r, 1400));
      Promise.all([cfg.task(), minWait]).then(([d]) => {
        clearInterval(timer);
        if (token !== loadToken) return;
        at = lis.length; mark();
        setTimeout(() => { if (token === loadToken) cfg.done(d); }, 450);
      }).catch((err) => {
        clearInterval(timer);
        if (token !== loadToken) return;
        el.innerHTML =
          '<div class="err"><h2>That did not load</h2><p class="sub">' + esc(err.message) + "</p></div>";
        bar({ back: !!history.length });
        setCta("Try again", () => go(run, { replace: true, fade: true }));
      });
    };
    go(run, opts);
  }

  async function api(payload) {
    let r;
    try {
      r = await fetch("/api/generate", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
    } catch { throw new Error("Looks like your signal dropped. Check it and try again."); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error === "no_key" ? "This page is not switched on yet. Let Mitch know." : "Something got stuck on our end. Give it another go.");
    return data;
  }

  // ---------- start ----------
  if (/[?&](new|reset|restart)\b/.test(location.search)) {
    try { localStorage.removeItem(KEY); } catch {}
    S = { name: "", business: "", questions: [], answers: {}, ideas: [], formats: [], idea: null, shot: null, done: {} };
    try { window.history.replaceState(null, "", location.pathname); } catch {}
  }
  if (S.name && S.business && S.ideas && S.ideas.length) {
    go(IdeasScreen, { fade: true });
    setTimeout(() => toast("Welcome back " + first()), 400);
  } else if (S.name) go(BizScreen, { fade: true });
  else go(NameScreen, { fade: true });
})();
</script>
</body>
</html>
